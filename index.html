```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Soccer World Cup</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #00ff00;
  color: white;
  font-family: Arial, sans-serif;
}

.scoreboard {
  max-width: 1050px;
  margin: auto;
  padding: 22px;
  background: linear-gradient(110deg,#101827,#1b2940);
  border: 2px solid #394a64;
  border-radius: 14px;
  display: grid;
  grid-template-columns: 1fr 260px 1fr;
  align-items: center;
  gap: 15px;
  box-shadow: 0 8px 25px #0007;
}

.team {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
}

.team.right {
  justify-content: flex-end;
  text-align: right;
}

.crest {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
  border-radius: 10px;
  background: #e9bd45;
  color: black;
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 900;
}

.name {
  font-size: 27px;
  font-weight: 900;
  white-space: nowrap;
}

.fullname {
  color: #aab6c8;
  font-size: 13px;
  margin-top: 5px;
}

.players {
  margin-top: 5px;
  color: #dce5f2;
  font-size: 12px;
  font-weight: bold;
}

.middle {
  text-align: center;
}

.score {
  font-size: 58px;
  font-weight: 900;
}

.timer {
  color: #ff6868;
  font-weight: bold;
  font-size: 14px;
}

.period {
  margin-top: 6px;
  font-size: 12px;
  color: #c6d0df;
  font-weight: bold;
}

.event {
  display: none;
  margin-top: 12px;
  padding: 12px 8px;
  border-radius: 8px;
  background: #263954;
  animation: appear .3s ease;
}

.event.show {
  display: block;
}

.event.goal {
  background: #126b43;
}

.event.yellow {
  background: #8a6810;
}

.event.red {
  background: #9b2533;
}

.event-title {
  font-size: 22px;
  font-weight: 1000;
  letter-spacing: 1px;
}

.event-detail {
  font-size: 12px;
  margin-top: 5px;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: scale(.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.controls {
  max-width: 1050px;
  margin: 22px auto;
  background: #101827;
  padding: 22px;
  border-radius: 12px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

fieldset {
  border: 1px solid #40516b;
  border-radius: 9px;
  padding: 15px;
}

legend {
  color: #e9bd45;
  font-weight: bold;
  padding: 0 8px;
}

label {
  display: block;
  margin: 9px 0 5px;
  color: #c5cede;
  font-size: 13px;
}

input, select {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #53627a;
  background: #25344b;
  color: white;
}

button {
  padding: 10px 13px;
  margin: 5px 3px;
  border: none;
  border-radius: 6px;
  background: #e9bd45;
  color: #101827;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.15);
}

.yellow-button {
  background: #f5d342;
}

.red-button {
  background: #e34250;
  color: white;
}

.secondary {
  background: #43536c;
  color: white;
}

.danger {
  background: #a72d3c;
  color: white;
}

.section {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #394a64;
}

@media(max-width:650px) {
  .scoreboard {
    grid-template-columns: 1fr 120px 1fr;
    padding: 10px;
  }

  .name {
    font-size: 16px;
  }

  .score {
    font-size: 35px;
  }

  .crest {
    width: 38px;
    height: 38px;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="scoreboard">

  <div class="team">
    <div class="crest" id="crestA">A</div>
    <div>
      <div class="name" id="displayA">TEAM A</div>
      <div class="fullname" id="fullA">HOME</div>
      <div class="players" id="playersA">7 PLAYERS</div>
    </div>
  </div>

  <div class="middle">

    <div class="score">
      <span id="scoreA">0</span> :
      <span id="scoreB">0</span>
    </div>

    <div class="timer" id="timerDisplay">
      ● LIVE · 00:00
    </div>

    <div class="period" id="periodDisplay">
      1ST HALF
    </div>

    <div class="event" id="eventBox">
      <div class="event-title" id="eventTitle"></div>
      <div class="event-detail" id="eventDetail"></div>
    </div>

  </div>

  <div class="team right">
    <div>
      <div class="name" id="displayB">TEAM B</div>
      <div class="fullname" id="fullB">AWAY</div>
      <div class="players" id="playersB">7 PLAYERS</div>
    </div>
    <div class="crest" id="crestB">B</div>
  </div>

</div>

<div class="controls">

<h2>WORLD CUP MATCH CONTROL</h2>

<div class="grid">

<fieldset>
<legend>TEAM A</legend>

<label>Team abbreviation</label>
<input id="teamA" value="TEAM A">

<label>Full team name</label>
<input id="fullTeamA" value="Home">

<label>Badge letters</label>
<input id="badgeA" value="A">

<label>Badge colour</label>
<input type="color" id="colorA" value="#e9bd45">

<label>Goal scorer</label>
<input id="scorerA" placeholder="Player name">

<button onclick="goal('A')">+ GOAL</button>
<button class="secondary" onclick="changeScore('A',-1)">- GOAL</button>

<label>Card recipient</label>
<input id="cardPlayerA" placeholder="Player name">

<button class="yellow-button" onclick="showCard('A','yellow')">YELLOW CARD</button>
<button class="red-button" onclick="showCard('A','red')">RED CARD</button>

</fieldset>

<fieldset>
<legend>TEAM B</legend>

<label>Team abbreviation</label>
<input id="teamB" value="TEAM B">

<label>Full team name</label>
<input id="fullTeamB" value="Away">

<label>Badge letters</label>
<input id="badgeB" value="B">

<label>Badge colour</label>
<input type="color" id="colorB" value="#e9bd45">

<label>Goal scorer</label>
<input id="scorerB" placeholder="Player name">

<button onclick="goal('B')">+ GOAL</button>
<button class="secondary" onclick="changeScore('B',-1)">- GOAL</button>

<label>Card recipient</label>
<input id="cardPlayerB" placeholder="Player name">

<button class="yellow-button" onclick="showCard('B','yellow')">YELLOW CARD</button>
<button class="red-button" onclick="showCard('B','red')">RED CARD</button>

</fieldset>

</div>

<div class="section">

<h3>MATCH TIMER</h3>

<label>Half length in minutes</label>
<input type="number" id="halfLength" value="5" min="1" max="45">

<button onclick="startTimer()">START</button>
<button class="secondary" onclick="pauseTimer()">PAUSE</button>
<button class="secondary" onclick="resetTimer()">RESET CLOCK</button>
<button onclick="nextHalf()">NEXT PERIOD</button>

</div>

<div class="section">

<h3>MATCH PERIOD</h3>

<select id="period">
<option>1ST HALF</option>
<option>HALF-TIME</option>
<option>2ND HALF</option>
<option>FULL-TIME</option>
<option>EXTRA TIME</option>
<option>PENALTIES</option>
</select>

</div>

<div class="section">

<h3>COMPETITION</h3>
<input id="competition" value="STREET SOCCER WORLD CUP">

<button onclick="resetMatch()" class="danger">RESET ENTIRE MATCH</button>

</div>

</div>

<script>

let scores = {A:0, B:0};

let players = {A:7, B:7};

let seconds = 0;

let timer = null;

let eventTimeout = null;

function get(id) {
  return document.getElementById(id);
}

function updateAll() {

  get("displayA").textContent = get("teamA").value || "TEAM A";
  get("displayB").textContent = get("teamB").value || "TEAM B";

  get("fullA").textContent = get("fullTeamA").value || "HOME";
  get("fullB").textContent = get("fullTeamB").value || "AWAY";

  get("crestA").textContent = get("badgeA").value || "A";
  get("crestB").textContent = get("badgeB").value || "B";

  get("crestA").style.background = get("colorA").value;
  get("crestB").style.background = get("colorB").value;

  get("scoreA").textContent = scores.A;
  get("scoreB").textContent = scores.B;

  get("playersA").textContent = players.A + " PLAYERS";
  get("playersB").textContent = players.B + " PLAYERS";

  get("periodDisplay").textContent = get("period").value;

}

function goal(team) {

  scores[team]++;

  updateAll();

  let name = get(team === "A" ? "teamA" : "teamB").value;
  let scorer = get(team === "A" ? "scorerA" : "scorerB").value.trim();

  showEvent(
    "goal",
    "GOAAAAAALLLL!",
    name + " SCORED!" + (scorer ? " · " + scorer : "")
  );

}

function changeScore(team, amount) {

  scores[team] = Math.max(0, scores[team] + amount);

  updateAll();

}

function showCard(team, type) {

  let playerInput = team === "A" ? "cardPlayerA" : "cardPlayerB";

  let playerName = get(playerInput).value.trim() || "Unknown player";

  let teamName = get(team === "A" ? "teamA" : "teamB").value;

  if (type === "yellow") {

    showEvent(
      "yellow",
      "🟨 YELLOW CARD",
      playerName + " · " + teamName
    );

  }

  if (type === "red") {

    if (players[team] <= 0) {
      showEvent("red", "NO PLAYERS LEFT", teamName);
      return;
    }

    players[team]--;

    updateAll();

    showEvent(
      "red",
      "🟥 SENT OFF!",
      playerName + " · " + teamName +
      " · " + players[team] + " PLAYERS REMAIN"
    );

  }

}

function showEvent(type, title, detail) {

  clearTimeout(eventTimeout);

  let box = get("eventBox");

  box.className = "event show " + type;

  get("eventTitle").textContent = title;

  get("eventDetail").textContent = detail;

  eventTimeout = setTimeout(() => {
    box.className = "event";
  }, 5000);

}

function startTimer() {

  if (timer) return;

  timer = setInterval(() => {

    let max = Number(get("halfLength").value) * 60;

    if (seconds >= max) {

      pauseTimer();

      get("timerDisplay").textContent = "● TIME UP";

      return;

    }

    seconds++;

    updateClock();

  }, 1000);

}

function pauseTimer() {

  clearInterval(timer);

  timer = null;

  get("timerDisplay").textContent = "Ⅱ PAUSED · " + formatTime();

}

function resetTimer() {

  pauseTimer();

  seconds = 0;

  updateClock();

}

function nextHalf() {

  pauseTimer();

  seconds = 0;

  let period = get("period");

  if (period.selectedIndex < period.options.length - 1) {
    period.selectedIndex++;
  }

  updateAll();

  updateClock();

}

function formatTime() {

  let min = Math.floor(seconds / 60);

  let sec = seconds % 60;

  return String(min).padStart(2,"0") + ":" +
         String(sec).padStart(2,"0");

}

function updateClock() {

  get("timerDisplay").textContent = "● LIVE · " + formatTime();

}

function resetMatch() {

  pauseTimer();

  clearTimeout(eventTimeout);

  scores = {A:0, B:0};

  players = {A:7, B:7};

  seconds = 0;

  get("period").selectedIndex = 0;

  get("eventBox").className = "event";

  updateAll();

  updateClock();

}

document.querySelectorAll("input").forEach(input => {
  input.addEventListener("input", updateAll);
});

get("period").addEventListener("change", updateAll);

updateAll();

updateClock();

</script>

</body>
</html>
```
